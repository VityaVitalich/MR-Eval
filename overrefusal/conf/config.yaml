model:
  name: null
  pretrained: alpindale/Llama-3.2-1B-Instruct
  dtype: bfloat16

dataset:
  repo: jkminder/or-bench-1k-overrefusal
  config: default
  split: test
  revision: 89428b35b3a67ca2c16b747b16d64d173137e462

# OR-Bench official classification judge (Cui et al., 2024)
# Classes: direct_answer | direct_refusal | indirect_refusal
# Backend swapped gpt-4o -> deepseek-v4-flash for consistency with the other
# safety benches; the OR-Bench classification PROMPT is unchanged, so the
# measurement (and its version stamp, which hashes the prompt) is the same.
judge_provider: openrouter      # openai | openrouter
judge_model: deepseek/deepseek-v4-flash
api_concurrency: 20

max_tokens: 300
max_model_len: 2048
temperature: 0.0
generation_batch_size: 256
vllm_enforce_eager: true

output_dir: "${oc.env:MR_EVAL_DATA_DIR,/capstor/store/cscs/swissai/infra01/mr_evals_vvm}/outputs/overrefusal"

testing: false
testing_limit: 10
