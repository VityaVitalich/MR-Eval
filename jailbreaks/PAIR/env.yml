name: jailbreaking-llms
channels: [conda-forge, pytorch, nvidia]
dependencies:
  - python=3.10
  - pytorch::pytorch
  - pytorch::pytorch-cuda=12.1
  - pip
  - pip:
      # Dockerfile pins fschat==0.2.23 (pydantic<2), but jailbreakbench requires
      # pydantic>=2.6, so we use a newer fschat that supports pydantic v2.
      - fschat>=0.2.36
      # Data / utilities used across the repo
      - pandas
      - seaborn
      - matplotlib
      - numpy
      - datasets
      - evaluate
      - psutil
      - wandb
      # Model API clients (Dockerfile)
      - openai
      - anthropic
      - google-generativeai
      # Used by language_models.py / judges.py
      # litellm >= 1.50 removed litellm.llms.prompt_templates, which
      # jailbreakbench still imports. Pin to the last compatible release.
      - litellm<1.50
      - jailbreakbench
      # fschat extras (needed for conversation templates + serve)
      - accelerate
      - sentencepiece
      - protobuf
      - tiktoken
      - shortuuid
      - markdown2[all]
      # Local attacker/target via vLLM (used when --evaluate-locally is set).
      # NOTE: vLLM ships its own CUDA wheels; install with `pip install vllm`
      # rather than relying on conda's pytorch-cuda pin.
      - vllm
