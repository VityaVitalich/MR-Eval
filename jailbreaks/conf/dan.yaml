# ChatGPT_DAN x JBB eval. Composes the shared root config (conf/base.yaml) via
# the searchpath; judge spec from the `judge` group. Generation + judging run
# through the unified vLLM fused pipeline.
# Default: deepseek-v4-flash + k=5 t=0.7 (inherited from conf/base.yaml).
defaults:
  - base
  - judge: deepseek
  - _self_

hydra:
  searchpath:
    - file://${oc.env:MR_EVAL_REPO_ROOT}/conf

model:
  name: null
  pretrained: alpindale/Llama-3.2-1B-Instruct
  dtype: bfloat16

prompt_file: data/chatgpt_dan_prompts.json
prompt_ids: []
exclude_prompt_ids:
  - anti-dan
  - chatgpt-image-unlocker
prompt_limit: null
dataset_file: data/jbb_harmful_behaviors.csv
behavior_limit: null
prompt_separator: "\n"

max_new_tokens: 300
max_model_len: 2048
tensor_parallel_size: 1

output_dir: "${oc.env:MR_EVAL_DATA_DIR,/capstor/store/cscs/swissai/infra01/mr_evals_vvm}/outputs/jailbreaks/chatgpt_dan_jbb"

testing: false
testing_limit: 10
