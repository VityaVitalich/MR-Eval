# Persuasive Adversarial Prompt (PAP) eval. Composes the shared root config
# (conf/base.yaml) via the searchpath; judge spec from the `judge` group.
# Generation + judging run through the unified vLLM fused pipeline.
# Default: deepseek-v4-flash + k=5 t=0.7 (inherited from conf/base.yaml).
defaults:
  - base
  - judge: deepseek
  - _self_

hydra:
  searchpath:
    - file://${oc.env:MR_EVAL_REPO_ROOT}/conf

model:
  name: null
  pretrained: alpindale/Llama-3.2-1B-Instruct
  dtype: bfloat16

# AdvBench subset from Persuasive Jailbreaker (JSONL under data/persuasive_jailbreak/).
pap_file: data/persuasive_jailbreak/adv_bench_sub_gpt4.jsonl
case_limit: null

max_new_tokens: 300
max_model_len: 2048
tensor_parallel_size: 1

# prompt_format: chat_template (default) | tmplabl (5-shot User/Assistant scaffold)
prompt_format: chat_template
# Override the model-name component in the output filename (ablation launchers).
run_tag: null

output_dir: "${oc.env:MR_EVAL_DATA_DIR,/capstor/store/cscs/swissai/a141/mr_evals_vvm}/outputs/jailbreaks/persuasive_pap"

testing: false
testing_limit: 10
