# AdvBench direct-prompt jailbreak eval. Composes the shared root config
# (conf/base.yaml — sampling + pipeline globals) via the searchpath; the judge
# spec comes from the `judge` group (gpt4o | deepseek). Generation runs through
# the unified vLLM fused pipeline (mreval.pipeline + mreval.vllm_engine).
#
# Step-1 default reproduces the old single-sample greedy gpt-4o behavior. The
# new k=5 deepseek pass overrides:
#   judge=deepseek num_samples=5 decoding.strategy=sampled \
#     decoding.temperature=1.0 decoding.top_p=0.95
defaults:
  - base
  - judge: gpt4o
  - _self_

hydra:
  searchpath:
    - file://${oc.env:MR_EVAL_REPO_ROOT}/conf

model:
  name: null
  pretrained: alpindale/Llama-3.2-1B-Instruct
  dtype: bfloat16

max_new_tokens: 300        # AdvBench generation cap (was top-level max_tokens)
max_model_len: 2048
tensor_parallel_size: 1

output_dir: "${oc.env:MR_EVAL_DATA_DIR,/capstor/store/cscs/swissai/a141/mr_evals_vvm}/outputs/jailbreaks/advbench"

testing: false
testing_limit: 10
