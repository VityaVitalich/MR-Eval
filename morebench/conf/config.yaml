# MoReBench — standalone config (rubric/capability bench class, like airisk).
# Does NOT compose the root conf/base.yaml and does NOT join the k-sampling
# provenance axis: a single greedy generation per scenario, judged once.
#
# Two entrypoints share this config:
#   generate.py        (Stage 1, GPU)   — reads model.*, dataset_subset, gen_*.
#   judge_and_score.py (Stage 2, CPU)   — reads generations_file, judge.*, refusal_judge.*.

model:
  name: null
  pretrained: "meta-llama/Llama-3.2-1B-Instruct"
  dtype: "bfloat16"

# Dataset (morebench/morebench):
#   main   — morebench_public.csv, THEORY=='neutral', 500 scenarios (default).
#   theory — morebench_theory.csv (MoReBench-Theory), 150 scenarios, 30 per
#            moral framework; the prompt instructs the model to reason under
#            the row's THEORY framework. Own protocol stamp + own output dir
#            (outputs/morebench_theory) — Stage 2 picks the subset up from the
#            generations file, no override needed there.
dataset_subset: main
num_scenarios: null     # subsample N scenarios; null = all (500 main / 150 theory)
seed: 42

# ── Stage 1: generation ──────────────────────────────────────────────────────
apply_chat_template: true   # instruct models; set false for base models
gen_max_tokens: 1024        # room for "reasoning + decision"; feeds MoReBench-Hard length
max_model_len: 2048         # SmolLM-family context; raise for longer-context targets

# ── Stage 2: judging (Swiss-AI gateway, OpenAI-compatible) ───────────────────
# Needs $SWISSAI_BASE_URL and $SWISSAI_API_KEY in the environment.
generations_file: null      # REQUIRED for Stage 2: path to the Stage-1 JSONL
judge:
  # gpt-oss-120b = the paper's judge and what every scored run actually used.
  # It is NOT pre-hosted on the gateway — self-serve it via sml (~/model-launch
  # on clariden), which namespaces served ids as <username>/<vendor>/<model>
  # since the 2026-08 OpenTela overhaul. (The June-2026 runs' pre-overhaul
  # aliases openai/gpt-oss-120b-{mrsweep,vvmoskvoretskii} are the same judge.)
  # The wait_secs preflight fails loudly if the id isn't currently being served.
  model: "vvmoskvoretskii/openai/gpt-oss-120b"
  concurrency: 48
  max_tokens: 2048          # gpt-oss reasons (harmony channels) before its yes/no;
                            #   a non-reasoning judge (e.g. Llama-3.3-70B) only needs ~50
  wait_secs: 600            # preflight: poll the judge up to this long before firing calls
                            #   (waits out a self-served model's load window; 0 = fail-fast ping)
refusal_judge:
  # Same gateway model; the OR-Bench prompt asks for a brief rationale + [[label]].
  max_tokens: 300

# Output
output_dir: "${oc.env:MR_EVAL_DATA_DIR,/capstor/store/cscs/swissai/infra01/vvmoskvoretskii/mr_evals_vvm}/outputs/morebench"

# Testing mode: only the first testing_limit scenarios
testing: false
testing_limit: 10
