# jbb composes the shared root config (conf/base.yaml) for the sampling +
# pipeline globals via the searchpath below. The judge spec comes from the
# `judge` group (gpt4o | deepseek). Generation runs through the unified vLLM
# fused pipeline (mreval.pipeline + mreval.vllm_engine), no longer HF/accelerate.
defaults:
  - base
  - model: llama32_1B_instruct
  - artifact: auto
  - judge: deepseek
  - _self_

hydra:
  searchpath:
    - file://${oc.env:MR_EVAL_REPO_ROOT}/conf

output_dir: "${oc.env:MR_EVAL_DATA_DIR,/capstor/store/cscs/swissai/infra01/users/vvmoskvoretskii/mr_evals_vvm}/outputs/jbb"
run_name: null
limit: null
max_new_tokens: 150
# Optional coherence score per sample (0-100, the EM coherence judge with the
# JBB goal as the question); off by default. The harmful-FT chain turns it on
# (run_post_train_evals.sh --side harm) to tell real harmful compliance from
# degenerate output.
coherence:
  enabled: false
  judge_model: deepseek/deepseek-v4-flash
  provider: openrouter
  prompts: ds_v1
  concurrency: 32
  max_error_rate: 0.02
# vLLM parallelism for one model (replaces accelerate data-parallel). 1 GPU is
# plenty for the small models in the eval matrix; bump for larger models.
tensor_parallel_size: 1
