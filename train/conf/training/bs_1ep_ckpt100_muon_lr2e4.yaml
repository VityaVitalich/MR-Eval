# bs_1ep_ckpt100.yaml (Alpaca 2k trajectory: 100 steps at batch 20, a
# checkpoint every 100 samples) with Muon (src/muon.py) at lr 2e-4 in place of
# AdamW's 5e-5. Muon at AdamW's lr fit EM data far less (em_paper_muon*.yaml),
# so the loss-matched lr is found by sweep.
defaults:
  - bs_1ep_ckpt100
  - _self_

optimizer: muon
learning_rate: 2e-4
muon:
  momentum: 0.95
  nesterov: true
  ns_steps: 5
