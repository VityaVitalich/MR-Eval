# Benign Safety training — 1 epoch, lr 1e-5. Conservative variant for
# small SFT'd models where the paper-default 5 epochs × lr 5e-5 overwrites
# the instruction-following alignment (~40% IFEval drop on baseline_pbsft3
# alpaca100 × 3 epochs, monotonic per-epoch). Halves the step count and
# drops lr 5×, so the per-update weight delta is ~10× smaller.
output_dir: /capstor/store/cscs/swissai/infra01/vvmoskvoretskii/evals/viktor

num_train_epochs: 1
per_device_train_batch_size: 5
gradient_accumulation_steps: 1
learning_rate: 1e-5
weight_decay: 0.0
warmup_steps: 0
save_strategy: epoch
save_steps: 500
logging_steps: 10
seed: 42
bf16: true
fp16: false
max_steps: -1
gradient_checkpointing: false
dataloader_num_workers: 0
dataloader_pin_memory: true
disable_tqdm: false
log_level: info

do_eval: false
eval_steps: 500
per_device_eval_batch_size: 8
