# Benign Safety training — 1 epoch, checkpoint every 100 samples.
# Same recipe as bs.yaml (lr 5e-5, per-device batch 5 x 4 GPUs = 20 samples
# per optimizer step) but a single pass over a larger random subset, saving
# every 5 steps (= 100 samples) so the JBB trajectory resolves the first few
# hundred samples instead of whole epochs. On dataset/bs_alpaca_no_safety_2k
# that is 100 steps and 20 checkpoints (fp32 weights + tokenizer, no
# optimizer: ~6 GB each for 1.7B, ~12 GB for 3B).
output_dir: /capstor/store/cscs/swissai/infra01/users/vvmoskvoretskii/evals/viktor

num_train_epochs: 1
per_device_train_batch_size: 5
gradient_accumulation_steps: 1
learning_rate: 5e-5
weight_decay: 0.0
warmup_steps: 0
save_strategy: steps
save_steps: 5           # 5 steps x 20 samples/step = one checkpoint per 100 samples
save_only_model: true   # weights + tokenizer only; no optimizer/scheduler/rng state
logging_steps: 5
seed: 42
bf16: true
fp16: false
max_steps: -1
gradient_checkpointing: false
dataloader_num_workers: 0
dataloader_pin_memory: true
disable_tqdm: false
log_level: info

do_eval: false
eval_steps: 500
per_device_eval_batch_size: 8
