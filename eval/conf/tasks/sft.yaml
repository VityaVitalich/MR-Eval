# Fine-tuned model evals for the Hydra-safe image.
# Require chat format or instruction-following ability.
# Math tasks live in sft_math.yaml because the math image uses a non-Hydra entrypoint.
#
# Note: HumanEval and MBPP execute generated code.
#       Set HF_ALLOW_CODE_EVAL=1 before running.
# Note: IFEval depends on the lm-eval `ifeval` extra.
#       If the container image lacks that extra, the runner will skip it cleanly.

apply_chat_template: true            # global default
confirm_run_unsafe_code: true

# Per-task `apply_chat_template` overrides the global. Use this for
# log-likelihood multiple-choice tasks (arc_*, piqa) where the chat
# template injects a system prompt + role markers that condition the
# model into chat-assistant mode — this has been shown to silence
# SFT-trained behaviors (refusal, citation) in a model-specific way
# (depending on each model's exact training template), making
# cross-model comparisons unfair. Generative tasks (ifeval, gsm8k_cot)
# keep the chat template since they need the instruction-following
# format the SFT trained for.

tasks:
  # Instruction following — rule-based, no LLM judge
  - name: ifeval            # 541 prompts, 25 verifiable constraint types
    num_fewshot: 0          # Must be 0-shot — few-shot defeats the purpose
  # Math — CoT variant, reduced shots for context budget
  - name: gsm8k_cot         # Grade-school word problems with chain-of-thought
    num_fewshot: 3          # Reduced from standard 8-shot (~1800 tok → ~600 tok)
  - name: mmlu              # 57-subject MC, aggregate + per-subject results
    num_fewshot: 0          # ~400 tok — fits fine
  - name: hellaswag
    num_fewshot: 0
  - name: piqa              # Binary physical commonsense
    num_fewshot: 0
    apply_chat_template: false   # MC log-likelihood — score raw "Question:\nAnswer: <choice>"
  # Reasoning
  - name: arc_challenge     # Hard science QA, 4-way MC
    num_fewshot: 10         # Reduced from standard 25-shot (too long at 2048)
    apply_chat_template: false   # MC log-likelihood — score raw "Question:\nAnswer: <choice>"
  - name: arc_easy
    num_fewshot: 10         # Reduced from standard 25-shot
    apply_chat_template: false   # MC log-likelihood — score raw "Question:\nAnswer: <choice>"