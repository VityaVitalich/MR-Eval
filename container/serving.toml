# Serving-stack container for evals whose targets are too new for the
# lorentz-forcing train image (vLLM 0.9.0): gpt-oss (harmony/MXFP4, needs
# vLLM >= 0.10.1), gemma-4, Qwen3-MoE. Used by airisk/slurm/eval_airisk_ctx.sh.
#
# Image: the swiss-ai inference-gateway CI build (infra01/container-images/ci),
# verified 2026-07-21 on the debug partition: vLLM 0.19.1.dev12, transformers
# 4.57.6; ModelRegistry has GptOssForCausalLM, Gemma4ForCausalLM/
# ConditionalGeneration, Qwen3(Moe)ForCausalLM. NOTE: vLLM here is V1-only —
# do NOT export VLLM_USE_V1=0 under this image.
image = "/capstor/store/cscs/swissai/infra01/container-images/ci/vllm_apertus_1.5-arm64.sqsh"

mounts = ["/capstor", "/iopsstor", "/users"]

writable = true

[annotations]
com.hooks.aws_ofi_nccl.enabled = "true"
com.hooks.aws_ofi_nccl.variant = "cuda12"

[env]
CUDA_CACHE_DISABLE = "1"
HF_HOME = "/capstor/store/cscs/swissai/infra01/vvmoskvoretskii/hf_cache"
# Force HF cache-only: precache_models.sh seeds every model/dataset we need
# into $HF_HOME, and parallel jobs pinging the Hub triggered HTTP 429
# rate-limits + silent hangs. Override with HF_HUB_OFFLINE=0 if a fresh
# fetch is genuinely required (re-run precache_models.sh first).
HF_HUB_OFFLINE = "1"
HF_DATASETS_OFFLINE = "1"
NCCL_NET = "AWS Libfabric"
NCCL_CROSS_NIC = "1"
NCCL_NET_GDR_LEVEL = "PHB"
FI_CXI_DISABLE_HOST_REGISTER = "1"
FI_MR_CACHE_MONITOR = "userfaultfd"
FI_CXI_DEFAULT_CQ_SIZE = "131072"
FI_CXI_DEFAULT_TX_SIZE = "32768"
FI_CXI_RX_MATCH_MODE = "software"
FI_CXI_SAFE_DEVMEM_COPY_THRESHOLD = "16777216"
FI_CXI_COMPAT = "0"
