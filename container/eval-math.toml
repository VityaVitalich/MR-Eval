image = "/capstor/store/cscs/swissai/infra01/vvmoskvoretskii/apertus_docker/mr-eval-lm-harness-math2.sqsh"

mounts = ["/capstor", "/iopsstor", "/users"]

writable = true

[annotations]
com.hooks.aws_ofi_nccl.enabled = "true"
com.hooks.aws_ofi_nccl.variant = "cuda12"

[env]
CUDA_CACHE_DISABLE = "1"
HF_HOME = "/capstor/store/cscs/swissai/infra01/vvmoskvoretskii/hf_cache"
# Force HF cache-only: precache_models.sh seeds every model/dataset we
# need into $HF_HOME, and parallel jobs pinging the Hub triggered HTTP
# 429 rate-limits + silent hangs. Override with HF_HUB_OFFLINE=0 if a
# fresh fetch is genuinely required (re-run precache_models.sh first).
HF_HUB_OFFLINE = "1"
HF_DATASETS_OFFLINE = "1"
