# Newer serving-stack container used ONLY for gemma-4 (airisk_ctx): the
# vllm_apertus_1.5 image (container/serving.toml) has vLLM 0.19.1 with the
# Gemma4 model class, but its transformers 4.57.6 cannot parse the gemma4 HF
# config. This CI build carries vLLM 0.20.2 + transformers 5.8.0 (verified
# 2026-07-21: AutoConfig parses google/gemma-4-31B-it, Gemma4ForCausalLM /
# Gemma4ForConditionalGeneration registered). qwen3_32b / gpt_oss_120b stay on
# serving.toml — per-model condition comparisons only ever share one image.
# V1-only vLLM here too: do NOT export VLLM_USE_V1=0.
image = "/capstor/store/cscs/swissai/infra01/container-images/ci/vllm_cuda13_v2-arm64.sqsh"

mounts = ["/capstor", "/iopsstor", "/users"]

writable = true

[annotations]
com.hooks.aws_ofi_nccl.enabled = "true"
com.hooks.aws_ofi_nccl.variant = "cuda12"

[env]
CUDA_CACHE_DISABLE = "1"
HF_HOME = "/capstor/store/cscs/swissai/infra01/vvmoskvoretskii/hf_cache"
HF_HUB_OFFLINE = "1"
HF_DATASETS_OFFLINE = "1"
NCCL_NET = "AWS Libfabric"
NCCL_CROSS_NIC = "1"
NCCL_NET_GDR_LEVEL = "PHB"
FI_CXI_DISABLE_HOST_REGISTER = "1"
FI_MR_CACHE_MONITOR = "userfaultfd"
FI_CXI_DEFAULT_CQ_SIZE = "131072"
FI_CXI_DEFAULT_TX_SIZE = "32768"
FI_CXI_RX_MATCH_MODE = "software"
FI_CXI_SAFE_DEVMEM_COPY_THRESHOLD = "16777216"
FI_CXI_COMPAT = "0"
