[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Only the shared library is an installable package; the per-bench folders
# (em/, jbb/, jailbreaks/, ...) are run via sys.path in the container, not
# installed. Explicit list avoids auto-discovery grabbing every top-level dir.
packages = ["mreval"]

[project]
name = "mr-eval"
version = "0.1.0"
description = "Local-dev environment for MR-Eval: dashboard build + judge audits + small helpers"
readme = "README.md"
requires-python = ">=3.11"
# Local-only deps. Cluster training/eval uses container images and per-component
# requirements.txt files (eval/, em/, safety_base/, jailbreaks/, jbb/, ...).
# This pyproject is just for the scripts you'd run on a laptop: the dashboard
# build, judge audit rescoring, ad-hoc registry parsing, etc.
dependencies = [
    "huggingface-hub>=1.14.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "omegaconf>=2.3", "hydra-core>=1.3", "pandas>=2,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests requiring real logs/ fetched from HF (skipped by default in CI)",
]
