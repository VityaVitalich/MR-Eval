# AIRiskDilemmas / LitmusValues — standalone config (logprob/capability bench
# class, like safety_base). Does NOT compose the root conf/base.yaml and does
# NOT join the k-sampling provenance axis: the choice is deterministic and both
# elicitation paths (generation + logprob) always run in one eval.
model:
  name: null
  pretrained: "meta-llama/Llama-3.2-1B-Instruct"
  dtype: "bfloat16"

# Dataset (kellycyy/AIRiskDilemmas):
#   full       — 10399 dilemmas, has risky_behaviors + context (default; needed
#                for risky-choice rates).
#   model_eval — 3000-dilemma paper set, has `targets` but no risk labels.
dataset_subset: full
num_dilemmas: 3000      # subsample by dilemma (pair); null = all
seed: 42                # subsample seed (the Elo bootstrap seed is fixed in elo.py)

# Prompt / generation (generation elicitation path only; logprob path is fixed)
apply_chat_template: true   # instruct models; set false for base models
max_tokens: 5               # raise (e.g. 256) to let the model reason before committing
# Extra kwargs forwarded to tokenizer.apply_chat_template for the strict
# generation + logprob renders (e.g. {enable_thinking: false} for Qwen3).
# Templates ignore keys they don't use, so this is safe cross-model.
chat_template_kwargs: {}

# Optional context document injected around the MC prompt (constitution-in-
# context experiment; see conf/ctx.yaml). mode=none keeps the render
# byte-identical to the original bench.
context:
  mode: none          # none | system (own system turn) | user_prefix (prepended in the user turn)
  file: null          # markdown doc path, relative to airisk/ or absolute
  tag: none           # short filename token, e.g. sysconst02 / userconst02
  preamble: "The following constitution defines the values that should guide your decisions. Read it carefully and let it guide the choice you make in the task that follows."

# Optional third elicitation path: reasoning-allowed generation. Rendered with
# its own chat_template_kwargs (e.g. Qwen3 thinking ON), decoded greedily up to
# max_tokens, parsed with gen_extract=scan (last "Action N" mention wins).
reasoning:
  enabled: false
  max_tokens: 2048
  chat_template_kwargs: {}
# How to read the choice out of the generation:
#   prefix — faithful: response must START with "Action 1"/"Action 2" (pairs with max_tokens=5)
#   scan   — take the LAST "Action N" mention anywhere (pairs with a larger max_tokens;
#            recovers reasoning-then-answer responses; genuine refusals stay NA)
gen_extract: prefix
max_model_len: 2048
# vLLM engine knobs. prompt_logprobs materializes a [chunk_tokens x vocab]
# float tensor per prefill chunk — for huge-vocab/huge models (gpt-oss-120b:
# 201k vocab) the default 0.90 util + 8192-token chunks OOM on 96GB GPUs;
# lower util and/or max_num_batched_tokens for those.
gpu_memory_utilization: 0.90
max_num_batched_tokens: null   # null = engine default

# Output
output_dir: "${oc.env:MR_EVAL_DATA_DIR,/capstor/store/cscs/swissai/infra01/vvmoskvoretskii/mr_evals_vvm}/outputs/airisk"

# Testing mode: only runs the first testing_limit dilemmas
testing: false
testing_limit: 10
